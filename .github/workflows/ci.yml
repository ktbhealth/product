name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything except the test suite: typecheck/lint (ci:check), build,
  # generated-file drift checks and knip.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Vite+ task runner: ci:* tasks live in vite.config.ts; ci:check and
      # the ci:test shards depend on ci:build (it generates the paraglide
      # output the tests import). All ci:* commands run inside ONE step:
      # every GitHub step changes GITHUB_ACTION, which busts the Vite+
      # task-cache fingerprint and forces ci:build to re-run. The drift
      # checks (db schema/migrations, i18n, worker types) need no build;
      # knip is static analysis.
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            vp-task-${{ runner.os }}-
      - run: >-
          bunx vp run ci:check &&
          bunx vp run ci:route-types &&
          bunx vp run ci:db-schema &&
          bunx vp run ci:db-migrations &&
          bunx vp run ci:i18n &&
          bunx vp run ci:worker-types &&
          bunx vp run ci:knip

  # The vitest suite (~520 files / ~5k tests, ~7min serial) is split into
  # disjoint shards via `vitest run --shard`. Each shard keeps coverage
  # enabled and adds the blob reporter, which serializes the istanbul
  # coverage map into `.vitest/blob/blob-<index>-<count>.json`; the
  # coverage-gate job merges the blobs with `vitest --mergeReports` and
  # enforces the global 100% thresholds from vitest.config.ts — the same
  # check an unsharded run performs.
  test:
    name: test-shard ${{ matrix.index }}/${{ matrix.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing shard should not cancel the others — the gate job needs
      # every blob to produce a meaningful merged coverage report.
      fail-fast: false
      matrix:
        include:
          - { index: 1, count: 8 }
          - { index: 2, count: 8 }
          - { index: 3, count: 8 }
          - { index: 4, count: 8 }
          - { index: 5, count: 8 }
          - { index: 6, count: 8 }
          - { index: 7, count: 8 }
          - { index: 8, count: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # No build step: generated files tests rely on (routeTree.gen.ts,
      # *.gen.ts) are committed, and the check job's drift tasks fail the
      # PR if any of them is stale. ci:build here was a ~15-20s vp
      # task-cache hit per shard that produced nothing the tests read.
      # Each shard only exercises ~1/8 of the suite, so its own coverage
      # is far below the global 100% thresholds — zero them here; the
      # coverage-gate job merges all shard blobs and enforces the real
      # thresholds from vitest.config.ts.
      - run: >-
          bunx vitest run
          --shard=${{ matrix.index }}/${{ matrix.count }}
          --reporter=default
          --reporter=github-actions
          --reporter=blob
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.statements=0
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.index }}
          path: .vitest/blob/
          if-no-files-found: error
          retention-days: 1

  # Merges the per-shard blob reports and enforces the 100% coverage
  # thresholds. `vitest --mergeReports` replays the recorded test files
  # (no tests re-run) and sums the istanbul coverage maps; the coverage
  # provider then runs the same threshold check as a normal run.
  coverage-gate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions:read downloads the baseline coverage artifact from the
    # latest green main run; pull-requests:write posts the sticky comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: bunx vitest --mergeReports
      # Job summary + coverage-report/ payload (summary copy + parsed
      # metrics) from the merged json-summary output.
      - run: bun tools/coverage-report.mjs
      # Machine-readable baseline for the next PR's sticky-comment delta.
      # Uploaded on every event so green main runs seed the baseline.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14
      # Browsable HTML coverage report (index.html at the artifact root).
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      # Sticky PR comment: diff against the latest green main run's
      # coverage-summary artifact. continue-on-error because main runs
      # predating this workflow have no such artifact.
      - name: Find baseline coverage run on main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        with:
          name: coverage-summary
          path: baseline
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Render sticky comment
        if: github.event_name == 'pull_request'
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: >-
          bun tools/coverage-report.mjs --comment
          --baseline baseline/coverage-summary.json
      # GITHUB_TOKEN is read-only on fork PRs — skip commenting there.
      - uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('coverage-report/comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Worker bundle size budget (T-063): fails when the deployable worker
  # module graph (apps/web/dist/server — JS + WASM, sourcemaps excluded)
  # exceeds the budget in tools/bundle-budget.mjs. Cloudflare's enforced
  # limit is 64 MiB UNCOMPRESSED (no compressed-size limit since
  # 2026-09-04); the budget sits at 48 MiB for ~25% headroom. On PRs the
  # latest green main run's bundle-size artifact provides the delta.
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions:read downloads the baseline bundle-size artifact from the
    # latest green main run.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            vp-task-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            vp-task-${{ runner.os }}-
      # Produces apps/web/dist/server — the worker bundle this job
      # measures. Task-cache hit when inputs are unchanged.
      - run: bunx vp run ci:build
      # Delta vs the latest green main run's bundle-size artifact.
      # continue-on-error because main runs predating this workflow have
      # no such artifact.
      - name: Find baseline bundle-size run on main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        with:
          name: bundle-size
          path: baseline
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          bun tools/bundle-budget.mjs
          --baseline baseline/bundle-size.json
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
      # Machine-readable baseline for the next PR's size delta. Uploaded
      # on every event so green main runs seed the baseline.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: bundle-size/
          if-no-files-found: warn
          retention-days: 14

  # Eval smoke gate: the consult-asr suite end-to-end on the `stub`
  # adapter profile — deterministic, zero-cost, no external services.
  # generate → run → gate --enforce exercises the whole CLI path
  # (manifest resolution, dataset store, pipeline, gate verdicts).
  # The gate's policy thresholds are overridden to values the canned
  # stub outputs can satisfy (stub WER is ~1.0 and minN=40 needs a
  # real cohort) — this job proves the pipeline RUNS and the enforce
  # exit code propagates, not that stub quality passes the real gate.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # tmp/ is gitignored and inside the workdir allowlist
      # (<cwd>/tmp), so no absolute-path flag is needed.
      - name: eval generate (stub cohort)
        run: bun apps/cli/src/main.ts eval generate consult-asr --n 2 --workdir tmp/eval-ci --run-id ci-gen
      - name: eval run (stub pipeline)
        run: bun apps/cli/src/main.ts eval run consult-asr --workdir tmp/eval-ci --run-id ci-run
      - name: eval gate --enforce
        run: >-
          bun apps/cli/src/main.ts eval gate consult-asr
          --workdir tmp/eval-ci --run-id ci-run --enforce
          --min-n 1 --max-wer 1 --target 0

  # Informational only — never gates. Lines-of-code report via tokei,
  # provided by the shared cypera toolbox (9aia/cypera).
  metrics:
    uses: 9aia/cypera/.github/workflows/loc-repo.yml@v0.2.3
    with:
      repo_name: product
      tool_ref: v0.2.3

  # ERD drift: regenerate the database docs (they live in the sibling public
  # docs repo) and fail if the committed output is stale. generate-erd.mjs
  # resolves the docs repo as ../../../docs relative to packages/db, i.e.
  # a sibling of this checkout — clone it anonymously (public repo, no
  # token needed) at $GITHUB_WORKSPACE/../docs.
  erd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TBLS_VERSION: v1.96.1
    steps:
      - &erd-checkout
        uses: actions/checkout@v4
      # The ERD pages live in the docs repo, so a schema change needs a
      # matching docs change. A docs branch with the same name as the pull
      # request's branch carries those pages until both merge; without
      # one — and on main — compare against the docs default branch.
      - &erd-clone-docs
        name: Clone docs repo (sibling of this checkout)
        env:
          DOCS_URL: https://github.com/ktbhealth/docs.git
          DOCS_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -n "$DOCS_BRANCH" ] && git ls-remote --exit-code --heads "$DOCS_URL" "refs/heads/$DOCS_BRANCH" >/dev/null 2>&1; then
            echo "Using docs branch $DOCS_BRANCH"
            git clone --depth 1 --branch "$DOCS_BRANCH" "$DOCS_URL" "$GITHUB_WORKSPACE/../docs"
          else
            echo "Using the docs default branch"
            git clone --depth 1 "$DOCS_URL" "$GITHUB_WORKSPACE/../docs"
          fi
      - &erd-setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - &erd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - &erd-install
        run: bun install --frozen-lockfile
      - &erd-tbls
        name: Install tbls
        run: |
          curl -fsSL "https://github.com/k1LoW/tbls/releases/download/${TBLS_VERSION}/tbls_${TBLS_VERSION}_linux_amd64.tar.gz" -o /tmp/tbls.tar.gz
          tar -xzf /tmp/tbls.tar.gz -C /tmp tbls
          sudo install -m 0755 /tmp/tbls /usr/local/bin/tbls
      - run: bun run db:erd:check
