# Local development services for the KTB Health app. Nothing here is
# deployed — production email goes through the Cloudflare `send_email`
# binding (see AGENTS.md, "Email in dev").
#
#   docker compose up -d      # start
#   docker compose down       # stop and remove
#
# Images are pinned to a release tag — bump deliberately.
name: ktb-dev

services:
  # Mail catcher: an SMTP server that accepts every message and shows it
  # in a web inbox instead of delivering it. Point the app at it with
  #   SMTP_URL=smtp://localhost:1026 EMAIL_FROM=noreply@ktb.local
  # (apps/web/.dev.vars) and read the mail at http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ktb-mailpit
    restart: unless-stopped
    ports:
      # Loopback only: a dev inbox has no business on the local network.
      # 1026/8026 instead of Mailpit's 1025/8025 so it does not clash
      # with other local mail catchers; override when these are taken too
      # (and adjust SMTP_URL to match).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    environment:
      # Messages are kept in memory and gone when the container is
      # recreated; cap them so a long-lived one does not grow unbounded.
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis: local jobs-queue transport (P-098 B2). Producers enqueue onto
  # the `ktb:jobs` list; `bun apps/jobs-worker/src/main.ts` consumes it.
  # In-memory only — queued jobs do not survive a restart, same as the
  # dev:node SQLite queue's best effort. Point producers at it with
  #   REDIS_URL=redis://localhost:6379
  # and run the worker alongside `bun run dev`.
  redis:
    image: redis:7.4-alpine
    container_name: ktb-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Speaker diarization backend (P-118): Speaches >= 0.9 exposes
  # POST /v1/audio/diarization (pyannote ONNX, CPU-only — do NOT steal
  # the GPU whisper/qwen need). Kept separate from the ASR image on
  # purpose: 0.9 dropped `vad_filter`, which is what gives us utterance
  # segments, so transcription stays on the proven image while this one
  # diarizes. Point the app at it with
  #   AUDIO_DIARIZATION=1
  #   AUDIO_DIARIZATION_URL=http://localhost:8001
  #   AUDIO_DIARIZATION_API_KEY=<same value as SPEACHES_DIAR_API_KEY>
  # When ASR also runs on a local server (AI_BASE_URL), remember
  #   AUDIO_TRANSCRIBE_MODEL=<a repo id that server actually has>
  # — the deploy default is the Cloudflare Workers AI id
  # (@cf/openai/whisper-large-v3-turbo), which a local faster-whisper
  # rejects with HTTP 500 → the job fails before ever diarizing.
  # First use needs the diarization models pulled once (non-gated ONNX
  # mirrors, no HF token):
  #   curl -X POST -H "Authorization: Bearer $SPEACHES_DIAR_API_KEY" \
  #     http://localhost:8001/v1/models/fedirz/segmentation_community_1
  #   curl -X POST -H "Authorization: Bearer $SPEACHES_DIAR_API_KEY" \
  #     http://localhost:8001/v1/models/Wespeaker/wespeaker-voxceleb-resnet34-LM
  speaches-diarization:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: ktb-speaches-diar
    # Opt-in profile: `docker compose --profile diarization up -d` —
    # plain `up` skips it so SPEACHES_DIAR_API_KEY is only required when
    # the feature is actually wanted.
    profiles: ["diarization"]
    restart: unless-stopped
    ports:
      # Loopback only — the endpoint is unauthenticated without API_KEY.
      - "127.0.0.1:${SPEACHES_DIAR_PORT:-8001}:8000"
    environment:
      # Speaches maps pydantic fields to uppercased env names — the
      # diarization route 403s without it (never run an exposed
      # instance without a key: the pyannote loader resolves model-repo
      # class paths, see speaches#679). Dev default keeps the profile
      # usable out of the box; the binding is loopback-only and the
      # port is never published beyond 127.0.0.1 — override for any
      # shared/remote deployment.
      API_KEY: ${SPEACHES_DIAR_API_KEY:-dev-diarization-key}
    volumes:
      - speaches-diar-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  speaches-diar-models:
