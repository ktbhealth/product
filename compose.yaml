# Local development services for the KTB Health app. Nothing here is
# deployed — production email goes through the Cloudflare `send_email`
# binding (see AGENTS.md, "Email in dev").
#
#   docker compose up -d      # start
#   docker compose down       # stop and remove
#
# Images are pinned to a release tag — bump deliberately.
name: ktb-dev

services:
  # Mail catcher: an SMTP server that accepts every message and shows it
  # in a web inbox instead of delivering it. Point the app at it with
  #   SMTP_URL=smtp://localhost:1026 EMAIL_FROM=noreply@ktb.local
  # (apps/web/.dev.vars) and read the mail at http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ktb-mailpit
    restart: unless-stopped
    ports:
      # Loopback only: a dev inbox has no business on the local network.
      # 1026/8026 instead of Mailpit's 1025/8025 so it does not clash
      # with other local mail catchers; override when these are taken too
      # (and adjust SMTP_URL to match).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    environment:
      # Messages are kept in memory and gone when the container is
      # recreated; cap them so a long-lived one does not grow unbounded.
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis: local jobs-queue transport (P-098 B2). Producers enqueue onto
  # the `ktb:jobs` list; `bun apps/jobs-worker/src/main.ts` consumes it.
  # In-memory only — queued jobs do not survive a restart, same as the
  # dev:node SQLite queue's best effort. Point producers at it with
  #   REDIS_URL=redis://localhost:6379
  # and run the worker alongside `bun run dev`.
  redis:
    image: redis:7.4-alpine
    container_name: ktb-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
